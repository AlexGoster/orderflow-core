name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: orderflow_suite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_suite_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install .
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://orderflow:ci-test-password@127.0.0.1:5432/orderflow_suite_test
        run: pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orderflow-core:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker compose up -d --build --wait
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/api/v1/products

      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down -v
